name: Deploy Convex backend

# Deploys the schema and functions in `convex/` to the deployment identified by
# CONVEX_DEPLOY_KEY, and sets the Clerk issuer that `convex/auth.config.ts`
# requires. The env var is set BEFORE the deploy: Convex refuses to deploy when
# `convex/auth.config.ts` references a variable that is missing on the target
# deployment.
#
# One-time setup
#   1. Convex dashboard -> your project -> Settings -> Deploy Keys -> generate a
#      key for the deployment your app points at (EXPO_PUBLIC_CONVEX_URL).
#   2. GitHub -> this repo -> Settings -> Secrets and variables -> Actions ->
#      New repository secret -> name: CONVEX_DEPLOY_KEY
#   3. Optional: add a repository VARIABLE named CLERK_JWT_ISSUER_DOMAIN if your
#      Clerk issuer differs from the default below.
#   4. Actions -> Deploy Convex backend -> Run workflow.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'convex/**'
      - '.github/workflows/convex-deploy.yml'

permissions:
  contents: read

concurrency:
  group: convex-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy schema and functions
    runs-on: ubuntu-latest
    steps:
      - name: Check the deploy key is configured
        id: guard
        env:
          DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Convex deploy skipped::CONVEX_DEPLOY_KEY is not set. Add it under Settings -> Secrets and variables -> Actions -> Secrets, then re-run this workflow."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.guard.outputs.configured == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        if: steps.guard.outputs.configured == 'true'
        run: npm ci --no-audit --no-fund

      - name: Set CLERK_JWT_ISSUER_DOMAIN on the deployment
        if: steps.guard.outputs.configured == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          ISSUER: ${{ vars.CLERK_JWT_ISSUER_DOMAIN }}
        run: |
          set -euo pipefail
          ISSUER="${ISSUER:-https://infinite-stinkbug-9915.clerk.accounts.dev}"
          echo "Setting CLERK_JWT_ISSUER_DOMAIN=$ISSUER"
          npx convex env set CLERK_JWT_ISSUER_DOMAIN "$ISSUER"
          npx convex env list --names-only

      - name: Deploy Convex functions and schema
        if: steps.guard.outputs.configured == 'true'
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: npx convex deploy
